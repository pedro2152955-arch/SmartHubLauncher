name: Build Smart Hub APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Smart Hub
        run: |
          mkdir -p project
          unzip -o SmartHubLauncher_Projeto_v2.zip -d project

      - name: Compilar APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartHub-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
