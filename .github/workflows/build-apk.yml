name: Gerar APK da TV OS

on:
  workflow_dispatch:
  push:
    branches: [principal, main]

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar projeto Smart Hub V7.4
        shell: bash
        run: |
          rm -rf projeto
          mkdir -p projeto

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Projeto Gradle encontrado na raiz."
            cp -R . projeto/
          elif [ -f "SmartHubLauncher_V7_4_PremiumCinema.zip" ]; then
            echo "Encontrado ZIP do Smart Hub V7.4."
            unzip -q "SmartHubLauncher_V7_4_PremiumCinema.zip" -d projeto
          else
            echo "ERRO: projeto V7.4 não encontrado."
            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Procurando build.gradle..."
          find projeto -name "build.gradle" -o -name "build.gradle.kts"

          GRADLE_FILE=$(find projeto -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: nenhum arquivo Gradle encontrado."
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_FILE")

          echo "Projeto Gradle encontrado em: $GRADLE_DIR"

          if [ ! -f "$GRADLE_DIR/settings.gradle" ] && [ ! -f "$GRADLE_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "Preparação concluída."

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          GRADLE_FILE=$(find projeto -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          GRADLE_DIR=$(dirname "$GRADLE_FILE")

          echo "Compilando em: $GRADLE_DIR"

          cd "$GRADLE_DIR"

          gradle assembleDebug --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          echo "Procurando APK..."
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Hub-V7-4-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
