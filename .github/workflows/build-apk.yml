name: Gerar APK da TV OS

on:
  workflow_dispatch:
  push:
    branches: [principal, main]

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar projeto Smart Hub V7.5.1
        shell: bash
        run: |
          rm -rf projeto
          mkdir -p projeto

          if [ -f "SmartHubLauncher_V7_5_1_AplicativosCorrigidos.zip" ]; then
            echo "Encontrado Smart Hub V7.5.1."
            unzip -q "SmartHubLauncher_V7_5_1_AplicativosCorrigidos.zip" -d projeto
          else
            echo "ERRO: arquivo SmartHubLauncher_V7_5_1_AplicativosCorrigidos.zip não encontrado."
            echo "Arquivos encontrados no repositório:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Verificando projeto..."

          GRADLE_FILE=$(find projeto -maxdepth 4 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: nenhum build.gradle encontrado."
            exit 1
          fi

          echo "Gradle encontrado em:"
          echo "$GRADLE_FILE"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          GRADLE_FILE=$(find projeto -maxdepth 4 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | head -n 1)

          GRADLE_DIR=$(dirname "$GRADLE_FILE")

          echo "Entrando em:"
          echo "$GRADLE_DIR"

          cd "$GRADLE_DIR"

          gradle assembleDebug --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Hub-V7-5-1-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
