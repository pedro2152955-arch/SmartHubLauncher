name: Gerar APK da TV OS

on:
  workflow_dispatch:
  push:
    branches: [principal, main]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto V7.1
        shell: bash
        run: |
          rm -rf projeto
          mkdir -p projeto
          unzip -q SmartHubLauncher_V7_1_PremiumIntegrada.zip -d projeto

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Hub-V7-1-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
